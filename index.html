<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Tự học Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Bố cục: thanh ngành + tab dính trên cùng; nội dung một cột rộng tối đa 1080px; màu nhấn đổi theo ngành */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E8ECF1; --ink:#15202B; --muted:#586577; --line:#D7DDE5;
  --a-gt:#2D5BCF; --a-kt:#A3570F; --a-ks:#0B7356; --a-it:#6A3FC8;
  --ok:#1B7F4B; --bad:#C2392F; --on-accent:#FFFFFF;
  --accent:var(--a-kt);
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Lexend",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1318; --surface:#171C23; --sunk:#202731; --ink:#E6EAF0; --muted:#9AA5B4; --line:#2B3440;
    --a-gt:#89A5FF; --a-kt:#E5A562; --a-ks:#52CBA2; --a-it:#B79EFF; --ok:#55C98D; --bad:#FF7B70; --on-accent:#0F1318;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#171C23; --sunk:#202731; --ink:#E6EAF0; --muted:#9AA5B4; --line:#2B3440;
  --a-gt:#89A5FF; --a-kt:#E5A562; --a-ks:#52CBA2; --a-it:#B79EFF; --ok:#55C98D; --bad:#FF7B70; --on-accent:#0F1318;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
  --accent-line:color-mix(in srgb,var(--accent) 38%,var(--line));
}
body[data-nganh="gt"]{--accent:var(--a-gt)}
body[data-nganh="kt"]{--accent:var(--a-kt)}
body[data-nganh="ks"]{--accent:var(--a-ks)}
body[data-nganh="it"]{--accent:var(--a-it)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

.head{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding-block:20px 14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 1rem var(--f-display);letter-spacing:.03em;flex:none}
h1{font-size:1.35rem}
.sub{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--sunk);border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .85rem/1 var(--f-body);padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center}
.seg button .dot{width:9px;height:9px;border-radius:50%}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,30,.12)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs-in button{flex:none;border:0;background:none;padding:12px 14px 10px;font:600 .94rem var(--f-body);color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer}
.tabs-in button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.main{padding-block:22px 72px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .875rem var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{padding:12px 20px;font-size:.95rem}
.ico{width:36px;height:36px;flex:none;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ico:hover{background:var(--sunk);color:var(--ink)}
.ico svg{width:18px;height:18px}
.knw[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
.muted{color:var(--muted)}
.eyebrow{font:700 .72rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}

/* Hình minh họa */
.pic{width:48px;height:48px;flex:none;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden}
.pic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pic svg .f{fill:currentColor;fill-opacity:.2}
.pic svg .d{fill:currentColor;stroke:none}
.pic svg text{fill:currentColor;stroke:none;text-anchor:middle;font-family:var(--f-body);font-weight:700}
.pic .emo{font-family:var(--f-emoji);font-size:26px;line-height:1;color:var(--ink)}
.pic.sm{width:32px;height:32px;border-radius:8px}
.pic.sm svg{width:22px;height:22px}
.pic.sm .emo{font-size:17px}
.pic.lg{width:min(128px,30vw);height:min(128px,30vw);border-radius:26px}
.pic.lg svg{width:70%;height:70%;stroke-width:1.7}
.pic.lg .emo{font-size:min(68px,16vw)}

/* Thanh công cụ, chủ đề */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;flex:1;min-width:0;font:inherit;color:var(--ink);padding:10px 0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-block:14px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;font:500 .82rem var(--f-body);color:var(--ink);cursor:pointer}
.chip .e{font-family:var(--f-emoji);font-size:15px}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
.count{color:var(--muted);font-size:.85rem;margin:10px 0 0;font-variant-numeric:tabular-nums}

/* Từ vựng */
.grp{display:flex;align-items:center;gap:10px;font-size:1.02rem;margin:24px 0 10px}
.grp small{margin-left:auto;font:500 .8rem var(--f-body);color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.wcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 6px 9px 9px}
.wcard.is-known{border-color:var(--accent-line)}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.en{font:600 1rem/1.3 var(--f-display);overflow-wrap:anywhere}
.vi{color:var(--muted);font-size:.875rem;line-height:1.35}
.note{font:600 .7rem var(--f-body);color:var(--accent);letter-spacing:.03em;margin-left:4px}
.wact{display:flex;flex-direction:column;gap:2px}

/* Mẫu câu */
.slist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:flex;gap:8px;align-items:center;padding:11px 8px 11px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.stxt{flex:1;min-width:0}
.stxt .en{font:500 1rem/1.4 var(--f-body)}

/* Phát âm 2 giọng */
.vp{display:inline-flex;gap:4px;flex:none;vertical-align:middle}
.vbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px 3px 7px;font:600 .72rem/1.2 var(--f-body);cursor:pointer}
.vbtn svg{width:14px;height:14px}
.vbtn .vg{font-family:var(--f-emoji);font-size:15px;line-height:1}
.vbtn:hover{color:var(--ink);border-color:var(--accent-line)}
.vbtn.playing{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vrow{margin-top:6px}
.vinfo{font-size:.78rem;color:var(--muted);margin:8px 0 0}

/* Dịch */
.tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tr-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tr-box.out{background:var(--accent-soft);border-color:var(--accent-line)}
.tr-lab{font:700 .72rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tr-box textarea{width:100%;min-height:190px;resize:vertical;border:0;background:transparent;color:var(--ink);font:400 1rem/1.55 var(--f-body);outline:none;padding:0}
.tr-out{min-height:190px;font-size:1rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.tr-out.ph{color:var(--muted)}
.tr-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tr-act .grow{flex:1}
.tr-note{margin-top:12px;font-size:.86rem;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 14px}
@media (max-width:720px){.tr-grid{grid-template-columns:1fr}.tr-box textarea,.tr-out{min-height:130px}}

/* Hội thoại */
.hc-mics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc-mic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;text-align:center}
.hc-mic:hover{border-color:var(--accent-line)}
.hc-mic .mic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-emoji);font-size:28px}
.hc-mic b{font:600 1rem var(--f-display)}
.hc-mic small{color:var(--muted);font-size:.8rem}
.hc-mic.on{border-color:var(--accent);background:var(--accent-soft)}
.hc-mic.on .mic{background:var(--accent);color:var(--on-accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 0%,transparent)}}
@media (prefers-reduced-motion: reduce){.hc-mic.on .mic{animation:none}}
.hc-live{min-height:1.6em;margin:10px 2px 0;color:var(--muted);font-style:italic}
.hc-log{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hc-b{max-width:min(620px,92%);border-radius:16px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.hc-b.me{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent-line)}
.hc-b .who{font:700 .7rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-b .src{font-size:.88rem;color:var(--muted)}
.hc-b .dst{font:500 1.05rem/1.45 var(--f-body)}
.hc-b .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hc-type{display:flex;gap:8px;margin-top:12px}
.hc-type input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
@media (max-width:560px){.hc-mics{grid-template-columns:1fr}}

/* Thành ngữ */
.tn-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tn-today{margin-top:14px;display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tn-today .tn-body{flex:1;min-width:0}
.tn-today .tn-i{font-size:1.3rem}
.tn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px;margin-top:10px}
.tn-row{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 12px 14px;min-width:0}
.tn-row.fav{border-color:var(--accent-line)}
.tn-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tn-i{font:600 1.02rem/1.35 var(--f-display);overflow-wrap:anywhere}
.tn-m{font-size:.9rem;line-height:1.45}
.tn-eq{font-size:.82rem;color:var(--muted)}
.tn-eq b{font-weight:600;color:var(--ink)}
.tn-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 9px}
.star[aria-pressed="true"]{color:#D99A00}
.more{display:flex;justify-content:center;margin-top:14px}

/* Lộ trình */
.plan-head{display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.plan-head h2{font-size:1.45rem}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.stat b{display:block;font:600 1.35rem var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.weekbar{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.wcell{height:42px;border:0;border-radius:7px;cursor:pointer;position:relative;color:var(--ink);font:600 .72rem var(--f-body);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.wcell.cur{outline:2px solid var(--accent);outline-offset:1px}
.mlabels{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:.72rem;color:var(--muted);margin-top:-12px}
.mlabels span{border-top:1px solid var(--line);padding-top:4px}
.month{margin-top:30px}
.month-h{display:flex;gap:14px;align-items:center}
.month-h .pic{width:54px;height:54px}
.month-h h3{font-size:1.15rem}
.month-h p{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.daily{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.daily b{font-size:.78rem;color:var(--muted);font-weight:600;margin-right:2px}
.daily span{background:var(--sunk);border-radius:8px;padding:5px 10px;font-size:.82rem}
.reads{font-size:.85rem;color:var(--muted);margin:0 0 10px}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:8px}
details.week summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-radius:14px}
details.week summary::-webkit-details-marker{display:none}
.wk-n{font:700 .85rem var(--f-display);width:2.4em;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-t{flex:1;min-width:0;font-weight:600}
.wk-c{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wk-full .wk-n{color:var(--accent)}
.wk-full .wk-c{color:var(--accent);font-weight:600}
.tasks{list-style:none;margin:0;padding:2px 14px 12px 14px;display:flex;flex-direction:column}
.task{display:flex;gap:12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.task:first-child{border-top:0}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer;color:transparent}
.chk svg{width:15px;height:15px}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task-t{flex:1;min-width:0}
.task.is-done .task-t{color:var(--muted);text-decoration:line-through}
.link{border:0;background:none;color:var(--accent);font:600 .82rem var(--f-body);cursor:pointer;padding:6px 4px;white-space:nowrap}
.prompt{margin:0 14px 14px;padding:12px 8px 12px 14px;background:var(--sunk);border-radius:10px;font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.prompt p{margin:0;flex:1;min-width:0}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:12px}
.app{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);text-decoration:none}
.app b{display:block;font-family:var(--f-display);font-weight:600}
.app span{font-size:.82rem;color:var(--muted)}
.sec-h{font-size:1.1rem;margin-top:36px}

/* Thẻ nhớ */
.fc-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini-seg{display:flex;gap:2px;padding:3px;background:var(--sunk);border-radius:10px}
.mini-seg button{border:0;background:none;padding:7px 10px;border-radius:8px;font:600 .8rem var(--f-body);color:var(--muted);cursor:pointer}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.tgl{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font:500 .82rem var(--f-body);color:var(--ink);cursor:pointer}
.tgl i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .2s}
.tgl[aria-pressed="true"] i{background:var(--accent)}
.tgl[aria-pressed="true"] i::after{transform:translateX(12px)}
.fc-stage{perspective:1400px;display:flex;justify-content:center;margin:20px 0 14px}
.card3d{position:relative;width:min(540px,100%);height:330px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);font:inherit;color:inherit}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;box-shadow:0 10px 30px -18px rgba(10,20,30,.35)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent-line)}
.face .big{font:600 clamp(1.4rem,5vw,2.1rem)/1.2 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.face .small{color:var(--muted);font-size:.95rem}
.face .hint{position:absolute;top:14px;left:18px;font:700 .68rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fc-ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.fc-ctrl .btn{min-width:130px;justify-content:center}
.btn.no{color:var(--bad)}
.btn.yes{color:var(--ok)}
.fc-prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;max-width:540px;margin:16px auto 6px}
.fc-prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.center{text-align:center}
.keys{font-size:.78rem;color:var(--muted);text-align:center;margin-top:8px}
kbd{font:600 .72rem var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}

.done-box .score{font:700 2.6rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.row-c{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Kiểm tra */
.qz{max-width:640px;margin:18px auto 0}
.q-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.q-ask{font-size:.82rem;color:var(--muted);font-weight:600}
.q-prompt{font:600 clamp(1.25rem,4.5vw,1.7rem)/1.3 var(--f-display);text-wrap:balance;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:12px;font:500 .95rem/1.4 var(--f-body);color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent-line)}
.opt:disabled{cursor:default}
.opt .k{font:700 .8rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.reveal{display:flex;gap:12px;align-items:center;margin-top:12px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.reveal .wtxt{text-align:left}
.q-next{display:flex;justify-content:flex-end;margin-top:12px}
.start{max-width:640px;margin:18px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.wrong{max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.875rem;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.25)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,12,18,.5);display:grid;place-items:center;padding:16px}
.panel{background:var(--surface);border-radius:16px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.panel textarea{width:100%;height:220px;font:13px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}

 const WARM=["andrew","brian","guy","christopher","aaron","evan","nathan","davis","roger","eric","steffan","ryan","thomas","daniel","gordon","david","mark","alex","fred"];
 const males=vs.filter(v=>MAL.test(v.name)&&!/female/i.test(v.name));
 const rank=v=>{const n=v.name.toLowerCase();const i=WARM.findIndex(w=>n.includes(w));return(i<0?WARM.length:i)-(/natural|online|neural/i.test(v.name)?100:0)};
 males.sort((a,b)=>rank(a)-rank(b));
 VO.m=males[0]||null;
 const base=vs[0]||null;
 VO.fFake=!VO.f;VO.mFake=!VO.m;
 if(!VO.f)VO.f=VO.m&&vs.find(v=>v!==VO.m)||base;
 if(!VO.m)VO.m=VO.f&&vs.find(v=>v!==VO.f)||base;
 const el=document.getElementById("vinfo");if(el)el.innerHTML=voiceInfo();
}
function voiceInfo(){
 if(!canSpeak)return"Trình duyệt này không hỗ trợ đọc tiếng Anh. Hãy mở bằng Chrome hoặc Edge.";
 const n=(v,fake)=>v?esc(v.name.replace(/^Microsoft |^Google /,"").replace(/ - English.*$/,""))+(fake?" (giả lập)":""):"giọng mặc định";
 return"Giọng đọc: 👨 "+n(VO.m,VO.mFake)+" · 👩 "+n(VO.f,VO.fFake);
}
let playingBtn=null,speakRun=0,speakTimer=null;
/* Giọng nam đọc theo từng cụm, nghỉ ngắn sau dấu phẩy và giữa các câu, nghe như vừa nghĩ vừa nói */
function speakChunks(t){return t.split(/(?<=[,;:—])\s+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean)}
function speak(t,g,btn){if(!canSpeak)return;g=g==="m"?"m":"f";try{
 speechSynthesis.cancel();clearTimeout(speakTimer);if(playingBtn)playingBtn.classList.remove("playing");
 const run=++speakRun,v=g==="m"?VO.m:VO.f;
 const parts=g==="m"?speakChunks(t):[t];
 const done=()=>{if(btn)btn.classList.remove("playing")};
 if(btn){playingBtn=btn;btn.classList.add("playing")}
 const play=i=>{
  if(run!==speakRun)return;
  if(i>=parts.length){done();return}
  const u=new SpeechSynthesisUtterance(parts[i]);u.lang="en-US";u.rate=g==="m"?(S.slow?.66:.85):(S.slow?.72:.95);
  if(v){u.voice=v;u.lang=v.lang}
  /* nam: hạ cao độ, đọc chậm hơn một chút cho trầm và ấm */
  u.pitch=g==="m"?(VO.mFake?.45:.6):(VO.fFake?1.35:1);
  u.onend=()=>{if(run!==speakRun)return;const gap=/[.!?]$/.test(parts[i])?450:/[,;:—]$/.test(parts[i])?250:0;speakTimer=setTimeout(()=>play(i+1),gap)};
  u.onerror=()=>{if(run===speakRun)done()};
  speechSynthesis.speak(u);
 };
 play(0)}catch(e){}}
function spkBtn(t){if(!canSpeak)return"";const a=esc(t);return'<span class="vp"><button class="vbtn" data-act="speak" data-g="m" data-t="'+a+'" title="Nghe giọng nam" aria-label="Nghe giọng nam: '+a+'">'+I.spk+'<span class="vg" aria-hidden="true">👨</span></button><button class="vbtn" data-act="speak" data-g="f" data-t="'+a+'" title="Nghe giọng nữ" aria-label="Nghe giọng nữ: '+a+'">'+I.spk+'<span class="vg" aria-hidden="true">👩</span></button></span>'}
function cpyBtn(t){return '<button class="ico" data-act="copy" data-t="'+esc(t)+'" title="Sao chép" aria-label="Sao chép câu">'+I.copy+"</button>"}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},3600)}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Đã sao chép")}catch(e){const a=$("#copyArea");a.value=t;$("#copyBox").hidden=false;a.focus();a.select()}}

function plan(ng){
 let tp;
 if(ng==="gt")tp=[0,1,2,3,4,5,2,3,1,0,null,null].map(i=>i===null?null:{ng:"gt",i});
 else{const n=DATA[ng].topics.length;tp=[0,1,2,3].map(i=>({ng:"gt",i}));for(let i=0;i<8;i++)tp.push(i<n?{ng,i}:null)}
 return tp.map((t,k)=>({w:k+1,m:Math.floor(k/4)+1,tp:t}));
}
function tasks(wk,ng){
 const m=MONTHS[wk.m-1],t=wk.tp;
 if(t){const name=DATA[t.ng].topics[t.i].ten;return[
  {txt:"Học từ vựng chủ đề “"+name+"”",go:["tu-vung",t.ng,t.i]},
  {txt:"Nghe và đọc to các mẫu câu “"+name+"”",go:["mau-cau",t.ng,t.i]},
  {txt:"Làm bài kiểm tra chủ đề, đạt từ 8/10",go:["kiem-tra",t.ng,t.i],quiz:true},
  {txt:m.viec}]}
 return[
  {txt:"Ôn toàn bộ từ vựng "+DATA[ng].ngan.toLowerCase()+" bằng Thẻ nhớ",go:["the-nho",ng,-1]},
  {txt:"Làm bài kiểm tra tổng hợp, đạt từ 8/10",go:["kiem-tra",ng,-1],quiz:true},
  {txt:"Viết 5 câu giới thiệu bản thân và công việc, nhờ AI sửa"},
  {txt:m.viec}];
}

 const total=stats.reduce((a,s)=>a+s.n,0),done=stats.reduce((a,s)=>a+s.d,0);

  '<div class="mlabels"><span>Tháng 1 · Nền tảng</span><span>Tháng 2 · Vào nghề</span><span>Tháng 3 · Phản xạ</span></div></div>';
 MONTHS.forEach(m=>{

   '<div class="daily"><b>Mỗi ngày:</b>'+m.moiNgay.map(x=>"<span>"+x+"</span>").join("")+"</div>";
  if(m.so===2)h+='<p class="reads">Nguồn đọc gợi ý: '+READ[ng].map(r=>'<a href="'+r[1]+'" target="_blank" rel="noopener">'+r[0]+"</a>").join(", ")+". Gặp từ hay thì lưu vào Anki hoặc Quizlet.</p>";
  P.filter(wk=>wk.m===m.so).forEach(wk=>{
   const k=wk.w-1,ts=tasks(wk,ng),full=stats[k].d===stats[k].n;
   const isOpen=openIds?openIds.includes("wk"+wk.w):k===cur;
   h+='<details class="week'+(full?" wk-full":"")+'" id="wk'+wk.w+'"'+(isOpen?" open":"")+'><summary><span class="wk-n">T'+wk.w+'</span><span class="pic sm" aria-hidden="true">'+pic(wkIcon(wk))+'</span><span class="wk-t">'+esc(wkTitle(wk))+(wk.tp&&wk.tp.ng!==ng?' <span class="muted" style="font-weight:400">· giao tiếp chung</span>':"")+'</span><span class="wk-c">'+(full?"Xong ":"")+stats[k].d+"/"+stats[k].n+'</span></summary><ul class="tasks">'+
    ts.map((t,j)=>{const key=tkey(ng,wk.w,j),d=S.done.has(key);return '<li class="task'+(d?" is-done":"")+'"><button class="chk" role="checkbox" aria-checked="'+d+'" data-act="task" data-k="'+esc(key)+'" aria-label="'+esc(t.txt)+'">'+I.check+'</button><span class="task-t">'+esc(t.txt)+"</span>"+(t.go?'<button class="link" data-act="go" data-tab="'+t.go[0]+'" data-ng="'+t.go[1]+'" data-i="'+t.go[2]+'">Mở →</button>':"")+"</li>"}).join("")+"</ul>";
   if(m.so===3){const p="Hãy đóng vai "+ROLE[ng]+", nói tiếng Anh với tôi. Tình huống: "+(wk.tp?DATA[wk.tp.ng].topics[wk.tp.i].ten:"tổng hợp các chủ đề "+DATA[ng].ngan.toLowerCase())+". Nói chậm, câu ngắn. Sau mỗi lượt của tôi, sửa lỗi và gợi ý câu tự nhiên hơn, rồi hỏi tiếp.";
    h+='<div class="prompt"><p><b>Câu lệnh cho AI:</b> '+esc(p)+"</p>"+cpyBtn(p)+"</div>"}
   h+="</details>";
  });

 });
 h+='<h3 class="sec-h">Ứng dụng đi kèm</h3><div class="apps">'+APPS.map(a=>{const inner='<div class="pic" aria-hidden="true">'+pic(a[0])+"</div><div><b>"+a[1]+"</b><span>"+a[2]+"</span></div>";return a[3]?'<a class="app" href="'+a[3]+'" target="_blank" rel="noopener">'+inner+"</a>":'<div class="app">'+inner+"</div>"}).join("")+"</div>";
 $("#v-lo-trinh").innerHTML=h;
}

/* ========== KIỂM TRA ========== */
function qzMake(){
 const ng=S.nganh,ti=S.topic,wp=shuffle(words(ng,ti)),sp=shuffle(sents(ng,ti)),allW=words(ng,-1),allS=sents(ng,-1);
 const qs=[];const used=new Set();
 const picPool=wp.filter(w=>String(w.pic).startsWith("svg:"));
 picPool.slice(0,2).forEach(w=>{used.add(w.id);const o=shuffle(allW.filter(x=>x.en!==w.en)).slice(0,3),opts=shuffle([w,...o]);qs.push({ask:"Hình minh họa này là từ nào?",picQ:w.pic,opts:opts.map(x=>x.en),ans:opts.indexOf(w),w})});
 const nS=Math.min(3,sp.length),nW=Math.min(10-nS-qs.length,wp.length-used.size);
 wp.filter(w=>!used.has(w.id)).slice(0,nW).forEach(w=>{const toVi=Math.random()<.5;const o=shuffle(allW.filter(x=>x.en!==w.en&&x.vi!==w.vi)).slice(0,3),opts=shuffle([w,...o]);
  qs.push({ask:toVi?"Nghĩa tiếng Việt là gì?":"Từ tiếng Anh là gì?",prompt:toVi?w.en:w.vi,promptEn:toVi,opts:opts.map(x=>toVi?x.vi:x.en),ans:opts.indexOf(w),w})});

/* ========== DỊCH ANH ↔ VIỆT (chạy độc lập, không dùng AI) ==========
   1) Câu hoặc từ có trong thư viện: dịch ngay, không cần mạng.
   2) Nội dung khác: dịch máy miễn phí MyMemory khi có mạng, không cần tài khoản.
   3) Không được thì mở Google Dịch. */
let trCtl=null; let trRes=null; let trBusy=false;
const keyOf=s=>norm(s).replace(/[^a-z0-9]+/g," ").trim();
function libExact(t,d){
 const k=keyOf(t);if(!k)return null;
 for(const ng of NG){
  for(const s of sents(ng,-1)){if(keyOf(d==="en"?s.en:s.vi)===k)return d==="en"?s.vi:s.en}
  for(const w of words(ng,-1)){
   if(d==="en"){if(keyOf(w.en)===k||(w.note&&keyOf(w.note)===k))return w.vi+(w.note?" ("+w.note+")":"")}
   else if(w.vi.split(/[,(]/).map(keyOf).includes(k))return w.en;
  }
 }
 return null;
}
function decodeHtml(s){const x=document.createElement("textarea");x.innerHTML=s;return x.value}
async function mmOne(s,d,signal){
 const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(s)+"&langpair="+(d==="en"?"en|vi":"vi|en"),{signal});
 if(!r.ok)throw new Error("http "+r.status);
 const j=await r.json();const tx=j&&j.responseData&&j.responseData.translatedText;
 if(!tx||/MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(tx)||(j.responseStatus&&+j.responseStatus!==200))throw new Error("quota");
 return decodeHtml(tx);
}
async function mmTranslate(t,d,signal){
 const out=[];
 for(const line of t.split("\n")){
  if(!line.trim()){out.push("");continue}
  const segs=[];let cur="";
  for(const p of(line.match(/[^.!?]+[.!?]*\s*/g)||[line])){
   if((cur+p).length>450&&cur){segs.push(cur);cur=""}
   if(p.length>450){for(let i=0;i<p.length;i+=450)segs.push(p.slice(i,i+450))}else cur+=p;
  }
  if(cur)segs.push(cur);
  const tr=[];for(const s of segs)tr.push(await mmOne(s.trim(),d,signal));
  out.push(tr.join(" "));
 }
 return out.join("\n").trim();
}

/* ========== NHẬN GIỌNG NÓI (dùng chung cho tab Dịch và Hội thoại) ==========
   - Mở trên claude.ai: dùng khả năng "dictation" của nền tảng (micro do claude.ai giữ).
   - Mở file trực tiếp: dùng Web Speech của trình duyệt (Chrome/Edge).
   - Điện thoại chặn micro khi mở file từ Zalo/Tệp: chỉ cách dùng micro trên bàn phím. */
let DICT=null,VS=null,MIC_BLOCKED=false;
(async()=>{try{if(window.claude&&typeof window.claude.use==="function"){const d=await window.claude.use("dictation");if(d){DICT=d;
 d.onPartial(e=>{if(VS&&VS.dict)VS.onPartial(e.text||"")});
 d.onFinal(e=>{if(VS&&VS.dict){const t=(e.text||"").trim();if(t){VS.got=true;VS.onFinal(t)}}});
 d.onState(e=>{if(e.state==="idle"&&VS&&VS.dict){const v=VS;VS=null;if(e.reason&&!["stopped","viewer_stopped","hidden"].includes(e.reason))voiceErr(e.reason);v.onEnd(v.got)}micUI()});
 if(S.tab==="dich"||S.tab==="hoi-thoai")render()}}}catch(e){}})();
function canVoice(){return!!(DICT||SR)}
function voiceStop(){if(!VS)return;if(VS.dict)DICT.stop().catch(()=>{});else{try{VS.rec.stop()}catch(e){}}}
function voiceStart(o){
 o.got=false;
 if(DICT){o.dict=true;VS=o;DICT.start({language:o.lang}).catch(e=>{if(VS===o){VS=null;o.onEnd(false)}voiceErr(e&&e.code);micUI()});micUI();return}
 if(!SR){toast("Trình duyệt này không nhận giọng nói. Hãy bấm micro trên bàn phím điện thoại, hoặc dùng Chrome/Edge.");return}
 const r=new SR();r.lang=o.lang==="vi"?"vi-VN":"en-US";r.interimResults=true;r.continuous=false;o.rec=r;VS=o;
 r.onresult=e=>{let tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){const t=x[0].transcript.trim();if(t){o.got=true;o.onFinal(t)}}else tmp+=x[0].transcript}o.onPartial(tmp)};
 r.onerror=e=>{if(VS===o)VS=null;micUI();voiceErr(e.error)};
 r.onend=()=>{if(VS===o)VS=null;micUI();o.onEnd(o.got)};
 try{r.start()}catch(e){VS=null;toast("Không bật được micro.")}
 micUI();
}

function renderHCLog(){
 const box=$("#hcLog");if(!box)return;
 if(!HC.log.length){box.innerHTML='<div class="empty" style="padding:24px 8px">Chưa có câu nào. Bấm một nút micro rồi bắt đầu nói.</div>';return}
 box.innerHTML=HC.log.slice().reverse().map(m=>{const to=m.from==="vi"?"en":"vi";return'<div class="hc-b'+(m.from==="vi"?" me":"")+'"><span class="who">'+(m.from==="vi"?"Bạn · tiếng Việt":"Người kia · tiếng Anh")+'</span><div class="src">'+esc(m.text)+"</div>"+
  '<div class="dst">'+(m.tr==null?'<span class="muted">Đang dịch…</span>':esc(m.tr))+"</div>"+
  (m.tr?'<div class="acts">'+hcSayBtn(m.tr,to)+cpyBtn(m.tr)+(m.src?'<span class="muted" style="font-size:.72rem">'+esc(m.src)+"</span>":"")+"</div>":"")+"</div>"}).join("");
}
async function hcAdd(text,from){
 const m={id:++HC.id,text,from,tr:null,src:""};HC.log.push(m);renderHCLog();
 const lib=libExact(text,from);
 if(lib){m.tr=lib;m.src="Từ thư viện"}
 else{try{m.tr=await mmTranslate(text,from);m.src="Dịch máy"}catch(e){m.tr="(Không dịch được"+(navigator.onLine===false?": máy đang mất mạng":"")+")";m.src=""}}
 renderHCLog();
 if(HC.auto&&m.src){if(from==="vi")speak(m.tr,S.g);else speakVi(m.tr)}
}
function hcMic(from){
 if(VS){voiceStop();return}
 try{speechSynthesis.cancel()}catch(e){}
 let acc="";const live=t=>{const l=$("#hcLive");if(l)l.textContent=t};
 voiceStart({lang:from,owner:"hc",
  onPartial:t=>live((acc+" "+t).trim()),
  onFinal:t=>{acc=(acc+" "+t).trim();live(acc)},
  onEnd:()=>{live("");if(acc)hcAdd(acc,from)}});
}
function renderHCMics(){document.querySelectorAll(".hc-mic").forEach(b=>{const f=b.dataset.from,on=VS&&VS.owner==="hc"&&VS.lang===f;b.classList.toggle("on",!!on);b.querySelector("b").textContent=on?(f==="vi"?"Đang nghe… bấm để dừng":"Listening… tap to stop"):(f==="vi"?"Tôi nói tiếng Việt":"Người kia nói tiếng Anh")})}
function hcSend(){const i=$("#hcIn");if(!i)return;const t=i.value.trim();if(!t)return;i.value="";hcAdd(t,VI_RE.test(t)?"vi":"en")}

function tnTags(L){return L==="sl"?SLR:TNTAG}
const TNTAG={cv:["Công việc","💼"],tb:["Tiền bạc & làm ăn","💰"],tc:["Tình cảm & quan hệ","❤️"],gd:["Gia đình & nguồn cội","🏡"],ng:["Tính cách & con người","🧑"],gt:["Lời nói & giao tiếp","💬"],tt:["Thành công & thất bại","🏆"],km:["Khó khăn & may rủi","🎲"],tg:["Thời gian & thời cơ","⏳"],hh:["Học hành & hiểu biết","📚"],sk:["Sức khỏe & cảm xúc","😊"],dl:["Đạo lý & ứng xử","⚖️"],tn:["Thiên nhiên & đời sống","🌿"]};

function tnKey(r){if(!r._k)r._k=norm(r[0]+" "+r[1]+" "+(r[3]||""));return r._k}
function tnFiltered(){const L=S.tnL,q=S.tnQ?norm(S.tnQ):"";return TN[L].filter(r=>(!S.tnTag||r[2]===S.tnTag)&&(!S.tnOnlyFav||S.tnFav.has(L+"|"+r[0]))&&(!q||tnKey(r).includes(q)))}
function tnSay(r,L){return L==="vi"?(r[3]||""):r[0]}
function tnRow(r,L,big){
 const id=L+"|"+r[0],f=S.tnFav.has(id),tg=tnTags(L)[r[2]]||["Khác","•"],say=tnSay(r,L);
 return '<article class="'+(big?"tn-today":"tn-row")+(f&&!big?" fav":"")+'">'+(big?'<div class="pic lg" aria-hidden="true">'+pic(tg[1])+"</div>":"")+'<div class="'+(big?"tn-body":"tn-main")+'">'+(big?'<p class="eyebrow" style="margin:0">'+(L==="sl"?"Từ lóng hôm nay":"Thành ngữ hôm nay")+"</p>":"")+'<div class="tn-i">'+esc(r[0])+'</div><div class="tn-m">'+esc(r[1])+"</div>"+
  (r[3]?'<div class="tn-eq">'+(L==="en"?"Tương đương: ":L==="sl"?"Ví dụ: ":"Tiếng Anh: ")+"<b>"+esc(r[3])+"</b>"+(L==="sl"&&canSpeak?" "+spkBtn(r[3]):"")+"</div>":"")+
  '<div class="tn-meta"><span class="tag">'+tg[1]+" "+tg[0]+"</span>"+(say&&canSpeak?spkBtn(say):"")+(big?'<button class="btn" data-act="tn-rand">🎲 Câu khác</button>':"")+"</div></div>"+
  '<button class="ico star" data-act="tn-fav" data-id="'+esc(id)+'" aria-pressed="'+f+'" title="'+(f?"Bỏ lưu":"Lưu thành ngữ này")+'" aria-label="Lưu '+esc(r[0])+'">'+(f?"★":"☆")+"</button></article>";
}

 if(!list.length){$("#v-thanh-ngu").innerHTML=h+'<div class="empty">Chưa nạp dữ liệu thành ngữ.</div>';return}
 if(tnTodayIdx===null||tnTodayIdx.L!==L){const d=new Date(),seed=d.getFullYear()*372+d.getMonth()*31+d.getDate();tnTodayIdx={L,i:(seed*7919)%list.length}}
 h+=tnRow(list[tnTodayIdx.i],L,true);

 if(L==="sl")h+='<p class="muted" style="font-size:.82rem;margin:0 0 6px">Tiếng lóng dùng trong giao tiếp thân mật. Tránh dùng trong email hay họp chính thức.</p>';
 if(S.tnMode==="list"){
  h+='<div class="toolbar"><label class="search">'+I.search+'<input id="tnQ" type="search" placeholder="'+(L==="en"?"Tìm thành ngữ, ví dụ: ice, tiền, thời gian":L==="sl"?"Tìm tiếng lóng, ví dụ: mate, tiền, mệt":"Tìm thành ngữ, ví dụ: nước, trâu, học")+'" value="'+esc(S.tnQ)+'" aria-label="Tìm thành ngữ"></label>'+

  $("#v-thanh-ngu").innerHTML=h;renderTNList();return;

function renderTNList(){

 if(!f.length)h+='<div class="empty">Không tìm thấy thành ngữ nào khớp. Thử từ khóa khác hoặc chọn “Tất cả”.</div>';

 $("#tnList").innerHTML=h;
}
function tnQuizMake(){
 const L=S.tnL,all=TN[L];let pool=S.tnTag?all.filter(r=>r[2]===S.tnTag):all;if(pool.length<4)pool=all;
 const qs=shuffle(pool).slice(0,10).map(r=>{const o=[r];const sh=shuffle(all);for(const x of sh){if(o.length>=4)break;if(x!==r&&x[1]!==r[1])o.push(x)}const opts=shuffle(o);return{r,opts:opts.map(x=>x[1]),ans:opts.indexOf(r)}});
 TNQ={qs,i:0,score:0,picked:-1,wrong:[],L};
}
function renderTNQuiz(){
 const box=$("#tnQuiz");if(!box)return;
 if(!TNQ||TNQ.L!==S.tnL){box.innerHTML='<div class="start"><div class="pic lg">'+pic("🧩")+'</div><h2 style="font-size:1.3rem">Đố nhanh thành ngữ</h2><p class="muted" style="margin:0;max-width:46ch">10 câu: đọc thành ngữ, chọn nghĩa đúng. Chọn chủ đề ở trên để đố trong chủ đề đó.</p><button class="btn pri big" data-act="tn-qstart">Bắt đầu</button></div>';return}
 const n=TNQ.qs.length;
 if(TNQ.i>=n){box.innerHTML='<div class="done-box" style="max-width:640px"><div class="pic lg">'+pic(TNQ.score>=8?"🏆":"📘")+'</div><div class="score">'+TNQ.score+"/"+n+"</div>"+(TNQ.wrong.length?'<div class="wrong"><p class="muted" style="margin:6px 0 0;font-size:.85rem">Các câu sai, bấm ☆ để lưu lại ôn:</p>'+TNQ.wrong.map(r=>tnRow(r,TNQ.L,false)).join("")+"</div>":"<b>Đúng hết, rất giỏi!</b>")+'<div class="row-c"><button class="btn pri" data-act="tn-qstart">Làm đề mới</button></div></div>';return}
 const q=TNQ.qs[TNQ.i],a=TNQ.picked>=0,say=tnSay(q.r,TNQ.L);
 let h='<div class="qz"><div class="q-top"><span>Câu '+(TNQ.i+1)+"/"+n+"</span><span>Đúng "+TNQ.score+'</span></div><div class="fc-prog" style="margin:6px 0 0;max-width:none"><i style="width:'+Math.round(TNQ.i/n*100)+'%"></i></div>'+
  '<div class="q-card"><span class="q-ask">Thành ngữ này nghĩa là gì?</span><div class="q-prompt">'+esc(q.r[0])+"</div>"+(TNQ.L!=="vi"&&canSpeak?spkBtn(say):"")+"</div>"+
  '<div class="opts">'+q.opts.map((o,j)=>{let cl="opt";if(a){if(j===q.ans)cl+=" ok";else if(j===TNQ.picked)cl+=" bad"}return'<button class="'+cl+'" data-act="tn-qans" data-j="'+j+'"'+(a?" disabled":"")+'><span class="k">'+(j+1)+"</span><span>"+esc(o)+"</span></button>"}).join("")+"</div>";
 if(a)h+=(q.r[3]?'<div class="reveal"><div class="wtxt"><span class="vi">'+(TNQ.L==="en"?"Tương đương: ":TNQ.L==="sl"?"Ví dụ: ":"Tiếng Anh: ")+"<b>"+esc(q.r[3])+"</b></span></div></div>":"")+'<div class="q-next"><button class="btn pri" data-act="tn-qnext" id="tnNext">'+(TNQ.i+1<n?"Câu tiếp →":"Xem kết quả")+"</button></div>";
 box.innerHTML=h+"</div>";
 if(a){const b=$("#tnNext");if(b)b.focus({preventScroll:true})}
}

 const b=e.target.closest("[data-act]");if(!b)return;

 if(act==="tab"){setTab(b.dataset.tab);return}
 if(act==="nganh"){const ng=b.dataset.ng;if(S.tab==="lo-trinh"){S.planNg=ng;S.nganh=ng}else S.nganh=ng;S.topic=-1;FC=null;QZ=null;save();render();return}
 if(act==="topic"){S.topic=+b.dataset.i;FC=null;QZ=null;render();return}
 if(act==="go"){S.nganh=b.dataset.ng;S.topic=+b.dataset.i;S.q="";FC=null;QZ=null;save();setTab(b.dataset.tab);window.scrollTo(0,0);return}
 if(act==="speak"){const g=b.dataset.g||S.g;if(S.g!==g){S.g=g;save()}speak(b.dataset.t,g,b);return}
 if(act==="hc-mic"){hcMic(b.dataset.from);return}
 if(act==="hc-send"){hcSend();return}
 if(act==="hc-auto"){HC.auto=!HC.auto;b.setAttribute("aria-pressed",HC.auto);return}
 if(act==="hc-clear"){HC.log=[];renderHCLog();return}
 if(act==="hc-copy"){if(!HC.log.length){toast("Chưa có hội thoại để chép");return}copyText(HC.log.map(m=>(m.from==="vi"?"Bạn: ":"Người kia: ")+m.text+"\n→ "+(m.tr||"")).join("\n\n"),"Đã chép hội thoại");return}
 if(act==="speak-vi"){speakVi(b.dataset.t);return}
 if(act==="tn-lang"){S.tnL=b.dataset.l;S.tnTag="";S.tnN=60;TNQ=null;save();renderTN();return}
 if(act==="tn-mode"){S.tnMode=b.dataset.m;renderTN();return}
 if(act==="tn-tag"){S.tnTag=b.dataset.t;S.tnN=60;TNQ=null;renderTN();return}
 if(act==="tn-more"){S.tnN+=60;renderTNList();return}
 if(act==="tn-onlyfav"){S.tnOnlyFav=!S.tnOnlyFav;S.tnN=60;renderTN();return}
 if(act==="tn-rand"){const n=TN[S.tnL].length;tnTodayIdx={L:S.tnL,i:Math.floor(Math.random()*n)};renderTN();return}
 if(act==="tn-fav"){const id=b.dataset.id;if(S.tnFav.has(id))S.tnFav.delete(id);else S.tnFav.add(id);save();const on=S.tnFav.has(id);document.querySelectorAll('[data-act="tn-fav"]').forEach(x=>{if(x.dataset.id===id){x.setAttribute("aria-pressed",on);x.textContent=on?"★":"☆";const row=x.closest(".tn-row");if(row)row.classList.toggle("fav",on)}});return}
 if(act==="tn-anki"){const f=tnFiltered();copyText(f.map(r=>r[0]+"\t"+r[1]+(r[3]?" ("+r[3]+")":"")).join("\n"),"Đã chép "+f.length+" thành ngữ. Quizlet: Nhập → dán. Anki: dán vào tệp .txt rồi Import.");return}
 if(act==="tn-qstart"){tnQuizMake();renderTNQuiz();return}
 if(act==="tn-qans"){if(!TNQ||TNQ.picked>=0)return;const j=+b.dataset.j,q=TNQ.qs[TNQ.i];TNQ.picked=j;if(j===q.ans)TNQ.score++;else TNQ.wrong.push(q.r);renderTNQuiz();return}
 if(act==="tn-qnext"){TNQ.i++;TNQ.picked=-1;renderTNQuiz();return}
 if(act==="tr-go"){trGo();return}
 if(act==="tr-mic"){trMic(b.dataset.l);return}
 if(act==="tr-clear"){S.trText="";trRes=null;if(trCtl)trCtl.abort();renderTr();const i=$("#trIn");if(i)i.focus();return}
 if(act==="tr-dir"){S.trDir=b.dataset.d;trRes=null;renderTr();return}
 if(act==="copy"){copyText(b.dataset.t,"Đã sao chép câu");return}
 if(act==="copy-close"){$("#copyBox").hidden=true;return}
 if(act==="slow"){S.slow=!S.slow;save();render();return}
 if(act==="known"){const id=b.dataset.id;if(S.known.has(id))S.known.delete(id);else S.known.add(id);save();renderWordList();return}
 if(act==="anki"){const list=words(S.nganh,S.topic).filter(matchQ);const txt=list.map(w=>w.en+"\t"+w.vi+(w.note?" ("+w.note+")":"")).join("\n");copyText(txt,"Đã chép "+list.length+" từ. Quizlet: Tạo học phần → Nhập → dán. Anki: dán vào tệp .txt rồi Import.");return}
 if(act==="task"){const k=b.dataset.k;if(S.done.has(k))S.done.delete(k);else S.done.add(k);save();const open=[...document.querySelectorAll("details.week[open]")].map(d=>d.id);const y=window.scrollY;renderPlan(open);window.scrollTo(0,y);return}
 if(act==="toweek"){const d=document.getElementById("wk"+b.dataset.w);if(d){d.open=true;d.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"})}return}
 if(act==="flip"){fcFlip();return}
 if(act==="fc-yes"){fcNext(true);return}
 if(act==="fc-no"){fcNext(false);return}
 if(act==="fc-dir"){S.dir=b.dataset.d;if(FC)FC.flip=false;renderFC();return}
 if(act==="fc-new"){S.onlyNew=!S.onlyNew;FC=null;renderFC();return}
 if(act==="fc-restart"){FC=null;renderFC();return}
 if(act==="fc-retry"){FC={deck:shuffle(FC.miss),i:0,flip:false,yes:0,miss:[]};renderFC();return}
 if(act==="qz-start"){qzMake();renderQZ();return}
 if(act==="qz-ans"){qzAnswer(+b.dataset.j);return}
 if(act==="qz-next"){qzNext();return}
});
document.addEventListener("input",e=>{
 if(e.target.id==="qWord"){S.q=e.target.value;renderWordList()}
 if(e.target.id==="qSent"){S.q=e.target.value;renderSentList()}
 if(e.target.id==="trIn"){S.trText=e.target.value;renderTrSide()}
 if(e.target.id==="tnQ"){S.tnQ=e.target.value;S.tnN=60;renderTNList()}
});
document.addEventListener("keydown",e=>{if(e.target.id==="trIn"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();trGo()}if(e.target.id==="hcIn"&&e.key==="Enter"){e.preventDefault();hcSend()}});
document.addEventListener("keydown",e=>{
 const tag=(e.target.tagName||"").toLowerCase();
 if(tag==="input"||tag==="textarea")return;
 if(e.key==="Escape"&&!$("#copyBox").hidden){$("#copyBox").hidden=true;return}
 if(S.tab==="the-nho"&&FC&&FC.i<FC.deck.length){
  if(e.key===" "&&tag!=="button"){e.preventDefault();fcFlip()}
  else if(e.key==="ArrowRight"){fcNext(true)}
  else if(e.key==="ArrowLeft"){fcNext(false)}
 }
 if(S.tab==="kiem-tra"&&QZ&&QZ.i<QZ.qs.length){
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4&&QZ.picked<0){qzAnswer(n-1)}
  else if(e.key==="Enter"&&QZ.picked>=0&&tag!=="button"){e.preventDefault();qzNext()}
 }
});
function setTab(t){S.tab=t;render();try{if(location.hash.slice(1)!==t)location.hash=t}catch(e){}}
function fromHash(){const h=location.hash.slice(1);S.tab=TABS.some(t=>t[0]===h)?h:"lo-trinh"}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.tab&&TABS.some(t=>t[0]===h)){S.tab=h;render()}});
if(canSpeak){try{pickVoices();speechSynthesis.addEventListener("voiceschanged",pickVoices)}catch(e){}}
fromHash();render();
</script>

</body></html>
